name: Desktop

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install sdl2 openal-soft
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libopenal-dev cmake g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 openal-soft

      - name: Configure
        run: |
          set +e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > configure.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            tail -30 configure.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 6000 > /tmp/cfg_msg.txt
            echo "::error::configure-tail:%0A$(cat /tmp/cfg_msg.txt)"
          fi
          tail -5 configure.log
          exit $CODE
        env:
          CMAKE_PREFIX_PATH: /opt/homebrew:/usr/local
        shell: bash

      - name: Build
        run: |
          set +e
          cmake --build build --config Release --parallel 4 > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            {
              echo "exit=$CODE";
              echo "--- compiler ---";
              (c++ --version 2>&1 | head -3);
              echo "--- cmake ---";
              (cmake --version 2>&1 | head -2);
              echo "--- disk ---";
              (df -h . 2>&1 | head -4);
              echo "--- build dir ---";
              (ls build/ 2>&1 | head -5);
              (find build -name "*.o" 2>/dev/null | wc -l);
            } > /tmp/env.txt 2>&1
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/env.txt | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 4000 > /tmp/env_msg.txt
            echo "::error::build-env:%0A$(cat /tmp/env_msg.txt)"
            tail -100 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 6000 > /tmp/bld_msg.txt
            echo "::error::build-tail:%0A$(cat /tmp/bld_msg.txt)"
            head -20 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 4000 > /tmp/bld_head.txt
            echo "::error::build-head:%0A$(cat /tmp/bld_head.txt)"
          fi
          tail -5 build.log
          exit $CODE
        shell: bash

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}
          path: |
            configure.log
            build.log

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: freeking-${{ runner.os }}
          path: build/bin/
          if-no-files-found: error
