name: Desktop

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install sdl2 openal-soft
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libopenal-dev cmake g++

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 openal-soft

      - name: Configure
        run: |
          set +e
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release > configure.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            grep -i -B3 -A10 "error" configure.log | head -60 | while IFS= read -r line; do
              echo "::error::cmake-configure: $line"
            done
          fi
          tail -5 configure.log
          exit $CODE
        env:
          CMAKE_PREFIX_PATH: /opt/homebrew:/usr/local
        shell: bash

      - name: Build
        run: |
          set +e
          cmake --build build --config Release -j > build.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            grep -i -B3 -A6 "error" build.log | head -60 | while IFS= read -r line; do
              echo "::error::cmake-build: $line"
            done
          fi
          tail -5 build.log
          exit $CODE
        shell: bash

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ runner.os }}
          path: |
            configure.log
            build.log

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: freeking-${{ runner.os }}
          path: build/bin/
          if-no-files-found: error
