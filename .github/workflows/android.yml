name: Android

on:
  push:
  pull_request:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Check Gradle
        run: gradle --version --console=plain

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --console=plain --stacktrace > ../gradle.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            awk '/^FAILED:/{show=30} show>0{print; show--}' ../gradle.log | head -60 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 6000 > /tmp/ninja_msg.txt
            if [ -s /tmp/ninja_msg.txt ]; then
              echo "::error::ninja-failure:%0A$(cat /tmp/ninja_msg.txt)"
            fi
            tail -25 ../gradle.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 6000 > /tmp/tail_msg.txt
            echo "::error::log-tail:%0A$(cat /tmp/tail_msg.txt)"
          fi
          tail -5 ../gradle.log
          exit $CODE
        working-directory: android
        shell: bash

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-android
          path: gradle.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: freeking-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
